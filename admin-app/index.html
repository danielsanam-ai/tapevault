<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TapeVault 관리자</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV 관리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#23262e">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#23262e;color:#f7f8fc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:20px;font-weight:600;margin:16px 0 6px}
p{font-size:14px;color:#c2cadc;line-height:1.6}
a.btn{display:inline-block;margin-top:18px;background:#f5a623;color:#1b1d23;text-decoration:none;font-weight:700;border-radius:10px;padding:12px 22px;font-size:15px}
.tip{margin-top:22px;font-size:13px;color:#9aa3b8}
</style>
</head>
<body>
<main>
  <img src="icon-180.png" alt="TapeVault">
  <h1>TapeVault 관리자</h1>
  <p id="msg">관리자 페이지로 이동하는 중입니다…</p>
  <a class="btn" href="https://admin.tapevault.net/">관리자 페이지 열기</a>
  <p class="tip" id="tip"></p>
</main>
<script>
// 홈 화면 아이콘으로 열면 바로 관리자 페이지로 이동한다.
// 브라우저에서 처음 열었을 때는 홈 화면 추가 방법을 보여 준다.
(function () {
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) { location.replace('https://admin.tapevault.net/'); return; }
  document.getElementById('msg').textContent = '이 화면을 휴대폰 홈 화면에 추가하면, 아이콘을 누를 때마다 관리자 페이지가 바로 열립니다.';
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  document.getElementById('tip').textContent = ios
    ? '아이폰: Safari 아래쪽 공유 버튼(□↑) → 「홈 화면에 추가」'
    : '안드로이드: Chrome 오른쪽 위 ⋮ → 「홈 화면에 추가」 또는 「앱 설치」';
})();
</script>
</body>
</html>
